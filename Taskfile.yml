version: '3'

vars:
  PROJECT_DIR: '{{.ROOT_DIR}}'

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # ==========================================================================
  # Setup & Configuration
  # ==========================================================================

  setup:
    desc: Initialize demo configuration (use '$streetlights-demo setup' in Cortex Code)
    cmds:
      - echo "Run '$streetlights-demo setup' in Cortex Code for guided setup"
      - echo "Or manually create .streetlights-demo/manifest.toml"

  # ==========================================================================
  # Data Generation
  # ==========================================================================

  generate:
    desc: Generate synthetic streetlight data
    cmds:
      - uv run generate {{.CLI_ARGS}}
    preconditions:
      - sh: command -v uv
        msg: "uv is required. Install: curl -LsSf https://astral.sh/uv/install.sh | sh"

  # ==========================================================================
  # Code Quality
  # ==========================================================================

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check .

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format .

  test:
    desc: Run tests
    cmds:
      - uv run pytest tests/ -v

  # ==========================================================================
  # PostgreSQL Operations
  # ==========================================================================

  pg:connect:
    desc: Connect to PG instance via psql
    cmds:
      - snow postgres connect -i {{.PG_INSTANCE}}
    vars:
      PG_INSTANCE:
        sh: "grep pg_instance .streetlights-demo/manifest.toml 2>/dev/null | cut -d'\"' -f2 || echo 'INSTANCE_NOT_SET'"

  pg:schema:
    desc: Apply schema to PG instance
    cmds:
      - psql -f init/01_enable_extensions.sql
      - psql -f init/07_create_iceberg_tables.sql

  pg:load:
    desc: Load CSV data into PG (requires psql connection env vars)
    cmds:
      - |
        for table in street_lights maintenance_records energy_consumption light_sensors weather_enrichment demographics power_grid_zones; do
          echo "Loading $table..."
          psql -c "\copy streetlights.$table FROM 'data/${table}.csv' CSV HEADER"
        done

  # ==========================================================================
  # Snowflake Operations
  # ==========================================================================

  sf:setup:
    desc: Run Snowflake setup SQL (database, schemas, warehouse)
    cmds:
      - snow sql -f snowflake/01_setup.sql

  sf:semantic-view:
    desc: Create Semantic View
    cmds:
      - snow sql -f snowflake/02_semantic_view.sql

  sf:search:
    desc: Create Cortex Search service
    cmds:
      - snow sql -f snowflake/03_cortex_search.sql

  sf:agent:
    desc: Create Intelligence Agent
    cmds:
      - snow sql -f snowflake/04_intelligence_agent.sql

  sf:forecast:
    desc: Train ML Forecast model
    cmds:
      - snow sql -f snowflake/05_ml_forecast.sql

  # ==========================================================================
  # Demo Workflow
  # ==========================================================================

  demo:
    desc: Run full demo (use '$streetlights-demo' in Cortex Code for guided flow)
    cmds:
      - echo "Run '$streetlights-demo step 1' through 'step 10' in Cortex Code"
      - echo "Or use individual sf:* and pg:* tasks for manual execution"

  cleanup:
    desc: Remove all demo resources (use '$streetlights-demo cleanup' in Cortex Code)
    cmds:
      - echo "Run '$streetlights-demo cleanup' in Cortex Code for guided teardown"
      - echo "This will drop all Snowflake objects and the PG instance"
