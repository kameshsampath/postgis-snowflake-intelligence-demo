[project]
name = "postgis-snowflake-intelligence-demo"
version = "2.0.0"
description = "Snowflake Postgres pg_lake + Snowflake Intelligence Demo - Street Lights Maintenance"
authors = [
    {name = "Kamesh Sampath"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "geopy>=2.4.0",
    "httpx>=0.27.0",
    "shapely>=2.0.2",
    "numpy>=1.24.3",
    "pandas>=2.0.3",
]

[project.scripts]
generate = "scripts.generate_all:main"
gate = "scripts.gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "app"]

[dependency-groups]
dev = [
    "ruff>=0.8.6",
    "pytest>=9.0.3",
    "pytest-mock>=3.12.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
